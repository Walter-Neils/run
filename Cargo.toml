[package]
name = "win-run"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.36.2", features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.36.2"
fuzzy-matcher = "0.3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The fuzzy search runs over ~100k packages on every keystroke, so optimize
# dependencies (and this crate) even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

